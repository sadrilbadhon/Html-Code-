<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html-3</title>
</head>
<body>
    <table>
        <caption>Student Information</caption>
        <tr>
            <th rowspan="6">Info</th>
            <th rowspan="2">Name</th>
            <th colspan="2">Address</th>
        </tr>
        <tr>
            <th>City</th>
            <th>House</th>
        </tr>
        <tr>
            <td>A</td>
            <td>Delhi</td>
            <td>1</td>
        </tr>
        <tr>
            <td>B</td>
            <td>Mumbai</td>
            <td>2</td>
        </tr>
        <tr>
            <td>C</td>
            <td>Kolkata</td>
            <td>3</td>
        </tr>
        <tr>
            <td>D</td>
            <td>Pune</td>
            <td>4</td>
        </tr>

    
        
        
    </table>

    <br>
    <form>
        <div>
            <label for="name">Name: </label>
            <input type="text" name="Name" id="name">
        </div>
        <div>
            <label for="sex">Sex: </label>
            <input type="radio" name="sex" id="sex">Male
            <label for="sex"></label>
            <input type="radio" name="sex" id="sex">Female
        </div>
        <div>
            <label for="country">Country: </label>
            <select name="country" id="country">
                <option value="Bangladesh">Bangladesh</option>
                <option value="USA">USA</option>
                <option value="pakistan">Pakistan</option>
                <option value="Nepal">Nepal</option>
                <option value="Vutan">Vutan</option>
            </select>
        </div>
        <div>
            <caption>Message: </caption>
            <br>
            <textarea name="message" id="message" rows=""></textarea>
        </div>
        <div>
            <input type="checkbox" name="checkbox" id="checkbox">Subscribe?
        </div>
        <button type="submit">Submit</button>

        

    </form>








</body>
</html>
