<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PracticeQS-9</title>
</head>
<body>
    <h2>Registration Form</h2>
    <div>
        <label for="Fist Name"></label>
        <textarea id="Fist Name" placeholder="Fist Name"></textarea>
        <label for="Last Name"></label>
        <textarea id="Last Name" placeholder="Last Name"></textarea>
    </div>
    <div>
        Please Select Your Gender:
        <select name="Gender" id="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <div>
        Do you agree to all terms of Service?
        <input type="checkbox" name="agree" id="agree">
        <label for="agree">Yes,I agree</label>
    </div>
    <button type="submit">Register</button>
</body>
</html>
